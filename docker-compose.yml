services:
  taxdeed-worker:
    build: .
    container_name: everest-taxdeed-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=America/New_York
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/data/taxdeed.db').execute('SELECT 1')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
