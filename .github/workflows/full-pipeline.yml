name: Full Pipeline (Calendar + Lots + Enrich + Publish)

on:
  workflow_dispatch:
    inputs:
      county:
        description: "Codigo condado (vazio = todos)"
        required: false
        default: ""
  schedule:
    # Todo dia 09:00 UTC = 05:00 AM ET (pipeline completa diaria)
    - cron: "0 9 * * *"
    # Reforco as 13:00 UTC = 09:00 AM ET (caso a primeira falhe)
    - cron: "0 13 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pipeline"
  cancel-in-progress: false

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_PATH: ./data/taxdeed.db
      OUTPUT_DIR: ./data/outputs
      LOG_DIR: ./logs
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_TO: dpr2004@hotmail.com
      REGRID_API_KEY: ${{ secrets.REGRID_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: 1) Init DB
        run: python -m src.main --init

      - name: 2) Calendar Scraper (datas reais via ALB)
        run: python -m src.main --scrape-calendar

      - name: 3) Lot List Scraper (propriedades reais)
        run: |
          if [ -n "${{ github.event.inputs.county }}" ]; then
            python -m src.main --scrape-lots --county "${{ github.event.inputs.county }}"
          else
            python -m src.main --scrape-lots
          fi

      - name: 3b) Regrid Enricher (API oficial - dados canonicos de parcela)
        run: python -m src.main --regrid
        continue-on-error: true

      - name: 4) Property Appraiser (fallback/complemento)
        run: python -m src.main --property-appraiser
        continue-on-error: true

      - name: 5) FEMA Flood Zones
        run: python -m src.main --fema --limit 100
        continue-on-error: true

      - name: 6) Scoring Engine
        run: python -m src.main --scoring
        continue-on-error: true

      - name: 7) Alert Engine
        run: python -m src.main --alerts
        continue-on-error: true

      - name: 7b) Gerar mapa real FL (67 condados do US Census)
        run: python scripts/gerar_mapa_fl.py
        continue-on-error: true

      - name: 8) Gerar data.json para o site
        run: python scripts/gerar_site_dados.py

      - name: 9) Commit DB + data.json
        run: |
          git config user.name "taxdeed-bot"
          git config user.email "bot@everest.com"
          git add data/ web/data.json web/fl-counties.svg || true
          git diff --staged --quiet || git commit -m "chore: full pipeline $(date -u +%Y-%m-%d_%H%M)"
          git push || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-pipeline-logs
          path: |
            logs/
            data/debug/
          retention-days: 14

      - name: 10) Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy-pages:
    needs: run-all
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
