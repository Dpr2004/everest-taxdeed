name: Publicar Site (GitHub Pages)

on:
  schedule:
    # Todo dia 7:30 AM ET (regenera site apos calendar + lot scrapers)
    - cron: '30 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/gerar_site_dados.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DB_PATH: ./data/taxdeed.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Init DB + seed (idempotente)
        run: python -m src.main --init
      - name: Rodar calendar scraper
        run: python -m src.main --scrape-calendar || true
      - name: Gerar data.json para o site
        run: python scripts/gerar_site_dados.py
      - name: Upload artifact para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
